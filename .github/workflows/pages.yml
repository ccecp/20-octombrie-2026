name: Verificare și publicare teste
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifică itemii și aplicația
        run: |
          node scripts/validate_content.cjs
          node --check app.js
          node scripts/test_app.cjs
          node scripts/test_print.cjs
      - name: Pregătește fișierele publice
        run: |
          mkdir _site
          cp index.html styles.css app.js print.html print.css print.js _site/
          cp -r tests pdfs _site/
      - name: Verifică activarea GitHub Pages
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages(context.repo);
              return true;
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                core.notice('Testele sunt verificate. Activați Settings → Pages → Source: GitHub Actions și relansați workflow-ul.');
                return false;
              }
              throw error;
            }
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.result == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.result == 'true'
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.result == 'true'
